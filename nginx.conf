events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Only these public assets may be served. In particular, never expose
        # .env, .git, location.json, source code or test fixtures from the mount.
        location = / { try_files /index.html =404; }
        location = /index.html { try_files $uri =404; }
        location ~ ^/(weather\.css|weather\.js|weather_image\.png|perth-in-the-clouds\.jpg)$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }
        location ~ ^/weather_(report|history)\.json$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location / { return 404; }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}