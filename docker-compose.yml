version: '3.8'

services:
  weatherbot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FORECAST_HOURS=${FORECAST_HOURS:-48}
      - MAX_REPORT_WORDS=${MAX_REPORT_WORDS:-300}
    volumes:
      # Directory mount permits atomic replacement of generated reports/images.
      - ./:/app
    restart: unless-stopped
    
  # Optional: Web server to serve the static files
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      # nginx.conf exposes only the explicit public-file allowlist.
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - weatherbot
    restart: unless-stopped